# Fly.io configuration. Rename the app below to something unique before the
# first deploy, or let `fly launch` pick a name for you.
app = "word-bot"
primary_region = "iad"

[build]

# No [http_service] or [[services]] block on purpose. This bot is a persistent
# gateway connection, not a web server — declaring a service would make Fly
# health-check a port nothing listens on, and autostop a machine that must
# stay up.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
